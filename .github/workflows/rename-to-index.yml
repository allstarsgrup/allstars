name: Rename to index

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename website file to index.html
        run: |
          mv website-grup-allstars.html index.html
          git config user.name "fauzibrow"
          git config user.email "fauzibrow34@gmail.com"
          git add -A
          git commit -m "Rename website file to index.html" || echo "nothing to commit"
          git push
